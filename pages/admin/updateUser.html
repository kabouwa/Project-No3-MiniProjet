<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet JS - Modifier Un Utilisateur</title>
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <header class="container-fluid  bg-dark">
        <!-- Chargemenet Depuis JS -->
    </header>

    <nav class="admin-navbar navbar bg-light">
        <!-- Chargemenet Depuis JS -->
    </nav>

    <aside class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </aside>

    <main class="d-flex flex-column px-5 hidden-aside">
        <p class="display-4 mt-3">
            Modification D'Utilisateur <span id="id"></span>
        </p>
        <form method="POST" class="update-form border p-3">
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nom">Nom :</label>
                    <input class="form-control" id="nom" type="text" placeholder="nom" name="nom">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="prenom">Prenom :</label>
                    <input class="form-control" id="prenom" type="text" placeholder="prenom" name="prenom">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="username">Nom d'utilisateur :</label>
                    <input class="form-control" id="username" type="text" placeholder="nom d'utilisateur" name="username">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="password">Mot de passe :</label>
                    <input class="form-control" id="password" type="text" placeholder="mot de passe" name="password">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="email">Email :</label>
                    <input class="form-control" id="email" type="text" placeholder="email" name="email">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="pays">Pays :</label>
                    <input class="form-control" id="pays" type="text" placeholder="pays" name="pays">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="age">Age :</label>
                    <input class="form-control" id="age" type="text" placeholder="age" name="age">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="devise">Devise :</label>
                    <input class="form-control" id="devise" type="text" placeholder="devise" name="devise">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="couleur">Couleur Prefere :</label>
                    <input class="form-control" id="couleur" type="color" placeholder="couleur" style="height: 38px;" name="couleur">
                </div>
            </div>
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <div class="form-check form-switch">
                        <label class="form-check-label" for="isAdmin">Administrateur</label>
                        <input class="form-check-input" id="isAdmin" type="checkbox" name="isAdmin">
                    </div>   
                </div>
            </div>
            <div class="row py-3">
                <div class="col-12 col-md-6"></div>
                <div class="col-12 col-md-3">
                    <button type="button" class="btn bg-danger text-white w-100 my-1" id="delBtn">Supprimer</button>
                </div>
                <div class="col-12 col-md-3">
                    <button type="submit" class="w-100 btn bg-success text-white my-1">Modifier</button>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <ul class="errors"></ul>
                </div>
            </div>
        </form>
    </main>
    <!-- Modals  -->
    <div class="confirm-delete d-flex align-items-center justify-content-center position-fixed d-none" style="width: 100vw;height: 100vh;background-color: rgba(0, 0, 0, 0.296);left: 0;top: 0;">
        <div class="box-delete p-3 bg-white rounded">
            <p class="h5">Supprimer un utilisateur</p>
            <p class="my-3">Vous confirmer la suppression de ce utilisateur ?</p>
            <form method="GET" action="users.html" class="delete-form d-flex justify-content-between gap-2">
                <button class="btn btn-success flex-grow-1" type="button" id="cancelDel">Annuler</button>
                <button class="btn btn-danger flex-grow-1" type="submit">Confirmer</button>
            </form>
        </div>
    </div>


    <footer class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
    <script src="/assets/js/parts.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/updateUser.js"></script>
</body>
</html>
