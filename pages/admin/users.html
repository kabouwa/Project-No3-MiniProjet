<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mini Projet JS - Liste Utilisateurs</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/layout.css">
 </head>
<body>
    <header class="container-fluid  bg-dark">
        <!-- Chargemenet Depuis JS -->
    </header>

    <nav class="admin-navbar navbar bg-light">
        <!-- Chargemenet Depuis JS -->
    </nav>

    <aside class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </aside>

    <main class="d-flex flex-column p-5 hidden-aside">
        <p class="display-3 mt-3">
            Liste Des utilisateurs
        </p>
        <div class="input-group">
            <p class="input-group-text m-0">Resultat : </p>
            <input type="text" class="form-control text-center" id="nb-users" style="width: 70px ;flex-grow : 0" readonly disabled>
            <p class="input-group-text m-0">Chercher : </p>
            <input type="text" class="form-control" placeholder="id nom prenom..." id="search">
        </div>

        <table class="table table-hover mt-3 mb-5">
            <thead>
                <tr>
                  <th>#</th>
                  <th>Nom</th>
                  <th>Prenom</th>
                  <th>Pseudo</th>
                  <th>Email</th>
                  <th>Admin</th>
                  <th>Actions</th>  
                </tr>
            </thead>
            <tbody id="table-users">
                <!-- Chargement depuis JavaScript -->
                 <tr>
                    <th colspan="11" class="my-5 py-5 text-center">
                        <!-- Aucune utilisateurs trouvee ! -->
                        Chargement des utilisateurs...
                    </th>
                </tr>
            </tbody>
        </table>
    </main>

    <footer class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
    <script src="/assets/js/parts.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/users.js"></script>
</body>
</html>
