<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet JS - Ajouter Un Utilisateur</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/33/33308.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/root.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <header class="container-fluid  bg-dark">
        <div class="container py-2 text-white d-flex justify-content-between">
            <a href="dashboard.html"><img src="" alt="logo" id="logo"></a>
            <div class="user-info d-flex justify-content-end align-items-center gap-2">
                <p class="m-0 fw-bold" id="user"></p>
                <button class="btn btn-danger" id="logout">Se Deconnecter</button>
            </div>
        </div>
    </header>

    <nav class="admin-navbar navbar bg-info d-none">
        <ul class="navbar-nav container flex-row justify-content-center gap-5">
            <li class="nav-item px-3">
                <a href="users.html" class="nav-link">Liste Utilisateurs</a>
            </li>
            <li class="nav-item px-3">
                <a href="addUser.html" class="nav-link">Ajouter un Utilisateur</a>
            </li>
        </ul>
    </nav>

    <aside class="bg-dark">
        <ul class="p-1">
            <li class="nav-item px-2 py-3 my-3">
                <a href="/pages/dashboard.html" class="nav-link text-white">Accueil</a>
            </li>
            <li class="nav-item px-2 py-3 my-3">
                <a href="/pages/profile.html" class="nav-link text-white">Profile</a>
            </li>
            <li class="nav-item px-2 py-3 my-3">
                <a href="/pages/changeColor.html" class="nav-link text-white">Modifier Couleur</a>
            </li> 
        </ul>
    </aside>

    <main class="d-flex flex-column px-5">
        <p class="display-3 mt-3">
            Ajouter Un Utilisateur
        </p>
        <form method="POST" action="users.html" class="create-form border p-3">
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nom">Nom :</label>
                    <input class="form-control" id="nom" type="text" placeholder="nom" name="nom">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="prenom">Prenom :</label>
                    <input class="form-control" id="prenom" type="text" placeholder="prenom" name="prenom">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="username">Nom d'utilisateur :</label>
                    <input class="form-control" id="username" type="text" placeholder="nom d'utilisateur" name="username">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="password">Mot de passe :</label>
                    <input class="form-control" id="password" type="text" placeholder="mot de passe" name="password">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="email">Email :</label>
                    <input class="form-control" id="email" type="text" placeholder="email" name="email">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="pays">Pays :</label>
                    <input class="form-control" id="pays" type="text" placeholder="pays" name="pays">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="age">Age :</label>
                    <input class="form-control" id="age" type="text" placeholder="age" name="age">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="devise">Devise :</label>
                    <input class="form-control" id="devise" type="text" placeholder="devise" name="devise">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="couleur">Couleur Prefere :</label>
                    <input class="form-control" id="couleur" type="color" placeholder="couleur" style="height: 38px;" name="couleur">
                </div>
            </div>
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <div class="form-check form-switch">
                        <label class="form-check-label" for="isAdmin">Administrateur</label>
                        <input class="form-check-input" id="isAdmin" type="checkbox" name="isAdmin">
                    </div>   
                </div>
            </div>
            <div class="row py-3">
                <div class="col-12 col-md-9"></div>
                <div class="col-12 col-md-3">
                    <button type="submit" class="w-100 btn bg-success text-white my-1">Ajouter</button>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <ul class="errors"></ul>
                </div>
            </div>
        </form>
    </main>

    <footer class="bg-dark">
        <div class="container pt-4 pb-5 border-top">
            <div class="row align-items-center justify-content-between g-3">
                
                <div class="col-12 col-md-6 text-center text-md-start text-secondary">
                    <p class="mb-1 fw-bold text-white">Mini Projet JavaScript</p>
                    <p><i class="bi bi-geo-alt-fill text-success me-2"></i>ISTA HaySalam, Sale, Maroc</p>
                </div>

                <div class="col-12 col-md-6 text-center d-flex justify-content-end">
                    <span class="me-3 text-light d-block mb-2 mb-md-0">Suivez-nous :</span>

                    <a href="https://facebook.com" class="btn btn-outline-secondary btn-sm rounded-circle me-2" ><i class="bi bi-facebook text-white"></i></a>
                    <a href="https://instagram.com" class="btn btn-outline-secondary btn-sm rounded-circle me-2"><i class="bi bi-instagram text-white"></i></a>
                    <a href="https://x.com" class="btn btn-outline-secondary btn-sm rounded-circle me-2"><i class="bi bi-twitter-x text-white"></i></a>
                    <a href="https://linkedin.com" class="btn btn-outline-secondary btn-sm rounded-circle"><i class="bi bi-linkedin text-white"></i></a>
                </div>
                
            </div>

            <p class="text-center text-light mt-3">&copy; 2026 ISTA HaySalam. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/addUser.js"></script>
</body>
</html>
