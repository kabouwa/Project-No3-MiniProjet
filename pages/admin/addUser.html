<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mini Projet JS - Ajouter Un Utilisateur</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/33/33308.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/root.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <header class="container-fluid  bg-dark">
        <!-- Chargemenet Depuis JS -->
    </header>

    <nav class="admin-navbar navbar bg-info">
        <!-- Chargemenet Depuis JS -->
    </nav>

    <aside class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </aside>

    <main class="d-flex flex-column px-5">
        <p class="display-3 mt-3">
            Ajouter Un Utilisateur
        </p>
        <form method="POST" action="users.html" class="create-form border p-3">
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nom">Nom :</label>
                    <input class="form-control" id="nom" type="text" placeholder="nom" name="nom">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="prenom">Prenom :</label>
                    <input class="form-control" id="prenom" type="text" placeholder="prenom" name="prenom">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="username">Nom d'utilisateur :</label>
                    <input class="form-control" id="username" type="text" placeholder="nom d'utilisateur" name="username">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="password">Mot de passe :</label>
                    <input class="form-control" id="password" type="text" placeholder="mot de passe" name="password">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="email">Email :</label>
                    <input class="form-control" id="email" type="text" placeholder="email" name="email">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="pays">Pays :</label>
                    <input class="form-control" id="pays" type="text" placeholder="pays" name="pays">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="age">Age :</label>
                    <input class="form-control" id="age" type="text" placeholder="age" name="age">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="devise">Devise :</label>
                    <input class="form-control" id="devise" type="text" placeholder="devise" name="devise">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="couleur">Couleur Prefere :</label>
                    <input class="form-control" id="couleur" type="color" placeholder="couleur" style="height: 38px;" name="couleur">
                </div>
            </div>
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <div class="form-check form-switch">
                        <label class="form-check-label" for="isAdmin">Administrateur</label>
                        <input class="form-check-input" id="isAdmin" type="checkbox" name="isAdmin">
                    </div>   
                </div>
            </div>
            <div class="row py-3">
                <div class="col-12 col-md-9"></div>
                <div class="col-12 col-md-3">
                    <button type="submit" class="w-100 btn bg-success text-white my-1">Ajouter</button>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <ul class="errors"></ul>
                </div>
            </div>
        </form>
    </main>

    <footer class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
    <script src="/assets/js/parts.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/addUser.js"></script>
</body>
</html>
