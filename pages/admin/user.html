<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet JS - Details Utilisateur</title>
    <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <header class="container-fluid  bg-dark">
        <!-- Chargemenet Depuis JS -->
    </header>

    <nav class="admin-navbar navbar bg-light">
        <!-- Chargemenet Depuis JS -->
    </nav>

    <aside class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </aside>

    <main class="d-flex flex-column px-5 hidden-aside">
        <p class="display-4 mt-3">
            Details D'Utilisateur <span id="id"></span>
        </p>
        <div class="user-info border p-3">
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nom">Nom :</label>
                    <input class="form-control" id="nom" type="text" placeholder="nom" readonly>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="prenom">Prenom :</label>
                    <input class="form-control" id="prenom" type="text" placeholder="prenom" readonly>
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="username">Nom d'utilisateur :</label>
                    <input class="form-control" id="username" type="text" placeholder="nom d'utilisateur" readonly>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="password">Mot de passe :</label>
                    <input class="form-control" id="password" type="text" placeholder="mot de passe" readonly>
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="email">Email :</label>
                    <input class="form-control" id="email" type="text" placeholder="email" readonly>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="pays">Pays :</label>
                    <input class="form-control" id="pays" type="text" placeholder="pays" readonly>
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="age">Age :</label>
                    <input class="form-control" id="age" type="text" placeholder="age" readonly>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="devise">Devise :</label>
                    <input class="form-control" id="devise" type="text" placeholder="devise" readonly>
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="couleur">Couleur Prefere :</label>
                    <input class="form-control" id="couleur" type="color" placeholder="couleur" readonly disabled style="height: 38px;">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="admin">Administrateur :</label>
                    <input class="form-control" id="admin" type="text" placeholder="admin" readonly>
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-8">

                </div>
                <div class="col-12 col-md-4">
                    <a href="" id="update-link" class="btn btn-warning w-100">Modifier</a>
                </div>
            </div>
            
        </div>
    </main>
    


    <footer class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
    <script src="/assets/js/parts.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/userDetails.js"></script>
</body>
</html>
