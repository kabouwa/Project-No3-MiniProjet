<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet JS - Changer Couleur</title>
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
    <header class="container-fluid  bg-dark">
        <!-- Chargemenet Depuis JS -->
    </header>

    <nav class="admin-navbar navbar bg-info">
        <!-- Chargemenet Depuis JS -->
    </nav>

    <aside class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </aside>


    <main class="d-flex flex-column px-5">
        <p class="display-3 mt-3">
            Changer Couleur 
        </p>
        <div class="invalid-user alert alert-danger">
                Vous n'avez pas l'age requis pour changer la couleur
        </div>
        <div class="user-info border p-3">
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="couleur">Couleur actuelle :</label>
                    <input class="form-control bg-white p-1" id="couleur" style="height: 35px;" type="color" placeholder="couleur" readonly disabled>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nouvelleCouleur">Nouvelle couleur :</label>
                    <input class="form-control p-1" id="nouvelleCouleur" style="height: 35px;" type="color">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <button class="btn btn-success" id="modifierCouleur">Modifier</button>
                </div>
            </div>
        </div>
    </main>


    <footer class="bg-dark">
        <!-- Chargemenet Depuis JS -->
    </footer>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/assets/js/parts.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/color.js"></script>
</body>
</html>
