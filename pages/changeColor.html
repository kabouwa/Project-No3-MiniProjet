<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header class="container-fluid  bg-dark">
        <div class="container py-2 text-white d-flex justify-content-between">
            <a href="dashboard.html"><img src="" alt="logo" id="logo"></a>
            <div class="header-user-info d-flex justify-content-end align-items-center gap-2">
                <p class="m-0 fw-bold" id="user"></p>
                <button class="btn btn-danger" id="logout">Se Deconnecter</button>
            </div>
        </div>
    </header>

    <nav class="admin-navbar navbar bg-info">
        <ul class="navbar-nav container flex-row justify-content-center gap-5">
            <li class="nav-item px-3">
                <a href="admin/users.html" class="nav-link">Liste Utilisateurs</a>
            </li>
            <li class="nav-item px-3">
                <a href="admin/addUser.html" class="nav-link">Ajouter un Utilisateur</a>
            </li>
        </ul>
    </nav>

    <aside class="bg-dark">
        <ul class="p-1">
            <li class="nav-item px-2 py-3 my-3">
                <a href="dashboard.html" class="nav-link text-white">Accueil</a>
            </li>
            <li class="nav-item px-2 py-3 my-3">
                <a href="profile.html" class="nav-link text-white">Profile</a>
            </li>
            <li class="nav-item px-2 py-3 my-3">
                <a href="changeColor.html" class="nav-link text-white">Modifier Couleur</a>
            </li> 
        </ul>
    </aside>

    <main class="d-flex flex-column px-5">
        <p class="display-3 mt-3">
            Changer Couleur 
        </p>
        <div class="invalid-user alert alert-danger">
                Vous n'avez pas l'age requis pour changer la couleur
        </div>
        <div class="user-info border p-3">
            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="couleur">Couleur actuelle :</label>
                    <input class="form-control bg-white p-1" id="couleur" style="height: 35px;" type="color" placeholder="couleur" readonly disabled>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="nouvelleCouleur">Nouvelle couleur :</label>
                    <input class="form-control p-1" id="nouvelleCouleur" style="height: 35px;" type="color">
                </div>
            </div>

            <div class="row py-3">
                <div class="col-12 col-md-6">
                    <button class="btn btn-success" id="modifierCouleur">Modifier</button>
                </div>
            </div>
        </div>
    </main>


    <footer class="bg-dark">
        <div class="container pt-4 pb-5 border-top">
            <div class="row align-items-center justify-content-between g-3">
                
                <div class="col-12 col-md-6 text-center text-md-start text-secondary">
                    <p class="mb-1 fw-bold text-white">Mini Projet JavaScript</p>

                    <a href="https://x.com" class="btn btn-outline-secondary btn-sm rounded-circle me-2"><i class="bi bi-twitter-x text-white"></i></a>

                </div>
