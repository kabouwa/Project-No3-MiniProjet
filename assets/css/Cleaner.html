// ── HELPERS ───────────────────────────────────────────────────
sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function makePassword(index) {
  const bases    = ["Secure","Strong","Valid","Safe","Alpha","Beta","Delta","Omega","Prime","Flash"];
  const specials = "!@#$%^&*";
  const base    = bases[index % bases.length];
  const digits  = String((index % 90) + 10);
  const special = specials[index % specials.length];
  return `${base}${digits}${special}`;
}

// ── BUILD 100 USERS ───────────────────────────────────────────
function buildUsers() {
  const users = [];
  for (let i = 0; i < 100; i++) {
    const prenom = firstNames[i % firstNames.length];
    const nom    = lastNames [i % lastNames.length];
    const pseudo = `${prenom.toLowerCase()}_${nom.toLowerCase().slice(0, 4)}${i + 1}`;
    users.push({
      nom,
      age:        String(18 + (i % 22)),
      admin:      i < 5,
      MotDePasse: makePassword(i),
      pseudo,
      prenom,
      couleur:    colors    [i % colors.length],
      Devise:     currencies[i % currencies.length],
      Pays:       countries [i % countries.length],
      avatar:     "https://cdn-icons-png.flaticon.com/512/18290/18290762.png",
      email:      `${pseudo}@gmail.com`,
      photo:      "https://loremflickr.com/cache/resized/65535_52982474046_b9c18f817f_c_640_480_nofilter.jpg"
    });
  }
  return users;
}

// ── MAIN ──────────────────────────────────────────────────────
const DELAY_MS = 600; // ms between each POST — safe for MockAPI free tier

(async () => {
  // 1) fetch all existing emails to detect duplicates
  console.log("🔍 Fetching existing users from MockAPI...");
  let existingEmails = new Set();
  try {
    const res      = await fetch(API_URL);
    const existing = await res.json();
    existing.forEach((u) => { if (u.email) existingEmails.add(u.email); });
    console.log(`   Found ${existingEmails.size} existing user(s). These will be skipped.\n`);
  } catch (err) {
    console.warn("   ⚠️  Could not fetch existing users:", err.message);
  }

  // 2) post only new users
  const users  = buildUsers();
  let posted   = 0;
  let skipped  = 0;
  let failed   = 0;

  for (let i = 0; i < users.length; i++) {
    const user = users[i];

    // skip if already exists
    if (existingEmails.has(user.email)) {
      console.log(`⏭️  [${i + 1}/100] SKIP — already exists: ${user.email}`);
      skipped++;
      continue;
    }

    // wait before posting
    await sleep(DELAY_MS);

    try {
      const res = await fetch(API_URL, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(user)
      });

      if (res.ok) {
        const created = await res.json();
        console.log(`✅ [${i + 1}/100] POSTED — ${user.pseudo} (id: ${created.id})`);
        existingEmails.add(user.email); // prevent re-posting in same run
        posted++;
      } else {
        const text = await res.text();
        console.error(`❌ [${i + 1}/100] FAILED (${res.status}) — ${user.pseudo}: ${text}`);
        failed++;

        // if rate limited (429) → wait longer then retry once
        if (res.status === 429) {
          console.warn("   ⏳ Rate limited! Waiting 5s then retrying...");
          await sleep(5000);
          const retry = await fetch(API_URL, {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify(user)
          });
          if (retry.ok) {
            const created = await retry.json();
            console.log(`   ♻️  RETRY OK — ${user.pseudo} (id: ${created.id})`);
            existingEmails.add(user.email);
            posted++;
            failed--;
          }
        }
      }
    } catch (err) {
      console.error(`💥 [${i + 1}/100] ERROR — ${user.pseudo}:`, err.message);
      failed++;
    }
  }

  console.log("\n─────────────────────────────");
  console.log(`🎉 Done!`);
  console.log(`   ✅ Posted  : ${posted}`);
  console.log(`   ⏭️  Skipped : ${skipped}`);
  console.log(`   ❌ Failed  : ${failed}`);
  console.log("─────────────────────────────");
})//();
