<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet JS - Se connecter</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/33/33308.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="d-flex justify-content-center align-items-center">
    <div class="auth-box d-flex flex-column justify-content-center align-items-center bg-white p-5">
        <form id="login-form" action="pages/dashboard.html" method="POST">
            <p class="display-5">Se connecter</p>
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="username" id="username" placeholder="Nom d'utilisateur">
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="password" name="password" id="password" placeholder="Mot de passe">
            <div class="form-check my-2">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Se souvenir de moi</label>
            </div>
            <button class="form-control form-control-lg bg-success text-white py-3" type="submit">CONNEXION</button>
            <ul class="errors"></ul>
            <p class="form-text text-secondary text-center mt-3 mb-0">Pas encore inscrit? <a class="text-success" href="pages/createAccount.html"> Créer un compte</a></p>
        </form>  
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
