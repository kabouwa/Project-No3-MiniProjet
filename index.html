<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mini Projet JS - Se connecter</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="d-flex justify-content-center align-items-center bg-dark">
    <div class="auth-box d-flex flex-column justify-content-center align-items-center bg-white p-5">
        <form id="login-form" action="pages/dashboard.html" method="POST" style="width:350px;">
            <p class="display-6 text-center">Mini Projet JS <br> Se connecter</p>
            <label class="form-label" for="username">Nom d'utilisateur</label>
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="username" id="username" placeholder="Nom d'utilisateur">
            <label class="form-label" for="password">Mot de passe</label>
            <div class="form-group">
                <input class="form-control form-control-lg mb-3 px-4 py-3" type="password" name="password" id="password" placeholder="Mot de passe">
                <button type="button" class="password-toggler"></button>
            </div>


            <div class="form-check my-2">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Se souvenir de moi</label>
            </div>
            <button class="form-control form-control-lg bg-success text-white py-3" type="submit">CONNEXION</button>
            <ul class="errors"></ul>
            <p class="form-text text-secondary text-center mt-3 mb-0">Pas encore inscrit? <a class="text-success" href="createAccount"> Créer un compte</a></p>
        </form> 
    </div> 


    
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/parts.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
