<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Projet JS - S'inscrire</title>
    <link rel="stylesheet" href="/assets/css/createAccount.css">
</head>
<body class="d-flex justify-content-center align-items-center">
    <div class="auth-box d-flex flex-column justify-content-center align-items-center bg-white p-5 my-5">
        
        <form id="signup-form" action="/" method="POST"  style="width:350px;">
            <p class="display-6 text-center">Mini Projet JS <br> S'inscrire</p>
            
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="nom" id="nom" placeholder="nom">
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="prenom" id="prenom" placeholder="prenom">
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="pays" id="pays" placeholder="pays">
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="age" id="age" placeholder="age">
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="email" id="email" placeholder="email">

            <!-- <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="devise" id="devise" placeholder="devise"> -->
            <select class="form-select form-control mb-3 px-4 py-3" name="devise" id="devise"></select>
            
            <input class="form-control form-control-lg mb-3 px-4 py-3" type="text" name="username" id="username" placeholder="nom d'utilisateur">
            <div class="form-group">
                <input class="form-control form-control-lg mb-3 px-4 py-3" type="password" name="password" id="password" placeholder="mot de passe">
                <button type="button" class="password-toggler"></button>
            </div>
            
            <button class="form-control form-control-lg bg-success text-white py-3" type="submit">S'inscrire</button>
            <ul class="errors"></ul>
            <p class="form-text text-secondary text-center mt-3 mb-0">Avez deja un compte? <a class="text-success" href="/">Se connecter</a></p>
        </form>  
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/assets/js/parts.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/currencies.js"></script>
    <script src="/assets/js/signup.js"></script>
</body>
</html>
